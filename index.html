<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phối màu Đơn tông (Monochromatic Palette)</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header & Nav (Màu bậc 4) -->
  <header class="header">
    <div class="container nav">
      <a href="#" class="logo">CodeGym Store</a>
      <ul class="nav-list">
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Sản phẩm</a></li>
      </ul>
    </div>
  </header>

  <!-- Nội dung (Màu bậc 7) -->
  <main class="container" style="padding: 40px 0;">
    <h2>Sản phẩm nổi bật</h2>
    <div class="card" style="padding: 20px; background: white; border-radius: 8px; margin-top: 20px;">
      <h3>Áo phông Lập trình viên</h3>
      <p>Mô tả chi tiết sản phẩm chất lượng cao.</p>
      <span class="badge-onsale">ON SALE</span>
      <button class="btn-preview">PREVIEW</button>
    </div>
  </main>

  <!-- Footer (Màu bậc 9) -->
  <footer class="footer">
    <p>&copy; 2026 CodeGym Demo - Monochromatic Color Theme.</p>
  </footer>

</body>
</html>
