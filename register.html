<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản - User Registration</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

  <main class="auth-card">
    <div class="auth-header">
      <h2>Tạo tài khoản mới</h2>
      <p>Nhanh chóng, đơn giản và dễ dàng sử dụng.</p>
    </div>

    <form action="success.html" method="GET" class="auth-form">
      <div class="form-group">
        <label for="fullname">Họ và tên <span class="required">*</span></label>
        <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
        <small class="form-hint">Nhập đầy đủ họ và tên của bạn</small>
      </div>

      <div class="form-group">
        <label for="email">Địa chỉ Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="example@domain.com" required>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu <span class="required">*</span></label>
        <input type="password" id="password" name="password" placeholder="Tối thiểu 8 ký tự" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Xác nhận mật khẩu <span class="required">*</span></label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Nhập lại mật khẩu" required>
      </div>

      <!-- Fitts' Law: Primary CTA Button kích thước lớn, màu nổi bật -->
      <button type="submit" class="btn btn-auth">Đăng ký ngay</button>
    </form>

    <div class="auth-footer">
      <p>Đã có tài khoản? <a href="#">Đăng nhập</a></p>
    </div>
  </main>

</body>
</html>
